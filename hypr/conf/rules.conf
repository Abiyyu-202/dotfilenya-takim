windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
  name = windowrule-3
  opacity = 0.76 0.66
  match:class = ^(foot)$
}

windowrule {
  name = windowrule-4
  opacity = 0.76 0.66
  match:class = ^(kitty)$
}

windowrule {
  name = windowrule-plasmawindowed
  float = 1
  size = 500 600
  center = 1
  match:class = ^(org\.kde\.plasmawindowed)$
}

windowrulev2 = float, class:^(org\.quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = center, class:^(org\.quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = size 94% 58%, class:^(org\.quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = pin, class:^(org\.quickshell)$, title:^(wallpaper-picker)$


layerrule {
  name = layerrule-1
  blur = on
  match:namespace = wofi
}
